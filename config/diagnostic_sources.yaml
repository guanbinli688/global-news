schema_version: '1.0'
purpose: 仅用于本地联通、格式与日期解析诊断，不改变候选源注册表的启用状态。
defaults:
  timeout_seconds: 18
  max_response_bytes: 2500000
  max_items: 40
  storage_policy: metadata_only
sources:
- id: bbc
  interface_type: rss
  url: https://feeds.bbci.co.uk/news/world/rss.xml
  documentation_url: https://support.bbc.co.uk/platform/feeds/NewsFeeds.htm
  documentation_status: official_legacy_feed_documentation
  license_status: syndication_or_feed_terms_review_required
  allow_local_preview: true
- id: guardian
  interface_type: rss
  url: https://www.theguardian.com/world/rss
  documentation_url: https://www.theguardian.com/help/feeds
  documentation_status: official_documentation
  license_status: personal_noncommercial_only_public_use_requires_review
  allow_local_preview: true
- id: dw
  interface_type: rss
  url: https://rss.dw.com/rdf/rss-en-world
  documentation_url: https://www.dw.com/
  documentation_status: official_domain_endpoint_documentation_not_reverified
  license_status: review_required
  allow_local_preview: true
- id: france24
